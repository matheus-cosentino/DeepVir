custom_data:
  disco_assembly_stats:
    fn: '*_assembly_stats.tsv'
    file_format: 'tsv'
    section_name: 'DeepVir assembly stats'
    description: 'Assembly metrics generated by DeepVir'
    plot_type: 'table'
    pconfig:
      title: 'Assembly statistics'
    headers:
      sample:
        title: 'Sample'
      tool:
        title: 'Assembler'
      num_contigs:
        title: 'Number of contigs'
        format: '{:,.0f}'
      total_bp:
        title: 'Total bp'
        format: '{:,.0f}'
      mean_length:
        title: 'Mean length'
        format: '{:,.2f}'
      median_length:
        title: 'Median length'
        format: '{:,.0f}'
      n50:
        title: 'N50'
        format: '{:,.0f}'
      max_length:
        title: 'Max length'
        format: '{:,.0f}'
      min_length:
        title: 'Min length'
        format: '{:,.0f}'

  disco_diamond_stats:
    fn: '*_diamond_stats.tsv'
    file_format: 'tsv'
    section_name: 'DeepVir Diamond stats'
    description: 'Diamond hit summaries generated by DeepVir'
    plot_type: 'table'
    pconfig:
      title: 'Diamond statistics'
    headers:
      sample:
        title: 'Sample'
      tool:
        title: 'Assembler'
      total_hits:
        title: 'Total hits'
        format: '{:,.0f}'
      unique_queries:
        title: 'Unique queries'
        format: '{:,.0f}'
      mean_identity:
        title: 'Mean identity (%)'
        format: '{:,.2f}'
      mean_bitscore:
        title: 'Mean bitscore'
        format: '{:,.2f}'

  disco_diamond_reads_stats:
    fn: '*_reads_diamond_stats.tsv'
    file_format: 'tsv'
    section_name: 'DeepVir reads Diamond stats'
    description: 'Diamond read-hit summaries generated by DeepVir'
    plot_type: 'table'
    pconfig:
      title: 'Reads Diamond statistics'
    headers:
      sample:
        title: 'Sample'
      tool:
        title: 'Tool'
      total_hits:
        title: 'Total hits'
        format: '{:,.0f}'
      unique_queries:
        title: 'Unique queries'
        format: '{:,.0f}'
      mean_identity:
        title: 'Mean identity (%)'
        format: '{:,.2f}'
      mean_bitscore:
        title: 'Mean bitscore'
        format: '{:,.2f}'

  disco_kraken2_stats:
    fn: '*_kraken2_stats.tsv'
    file_format: 'tsv'
    section_name: 'DeepVir Kraken2 stats'
    description: 'Kraken2 classification summaries generated by DeepVir'
    plot_type: 'table'
    pconfig:
      title: 'Kraken2 statistics'
    headers:
      sample:
        title: 'Sample'
      tool:
        title: 'Assembler'
      total_reads:
        title: 'Total reads'
        format: '{:,.0f}'
      classified_reads:
        title: 'Classified reads'
        format: '{:,.0f}'
      unclassified_reads:
        title: 'Unclassified reads'
        format: '{:,.0f}'
      classified_percent:
        title: 'Classification rate (%)'
        format: '{:,.2f}'

  disco_kraken2_reads_stats:
    fn: '*_reads_kraken2_stats.tsv'
    file_format: 'tsv'
    section_name: 'DeepVir reads Kraken2 stats'
    description: 'Kraken2 read-classification summaries generated by DeepVir'
    plot_type: 'table'
    pconfig:
      title: 'Reads Kraken2 statistics'
    headers:
      sample:
        title: 'Sample'
      tool:
        title: 'Tool'
      total_reads:
        title: 'Total reads'
        format: '{:,.0f}'
      classified_reads:
        title: 'Classified reads'
        format: '{:,.0f}'
      unclassified_reads:
        title: 'Unclassified reads'
        format: '{:,.0f}'
      classified_percent:
        title: 'Classification rate (%)'
        format: '{:,.2f}'

  disco_darkmatter_stats:
    fn: '*_darkmatter_stats.tsv'
    file_format: 'tsv'
    section_name: 'DeepVir dark matter stats'
    description: 'Dark matter/no-hit statistics generated by DeepVir'
    plot_type: 'table'
    pconfig:
      title: 'Dark matter statistics'
    headers:
      sample:
        title: 'Sample'
      tool:
        title: 'Assembler'
      no_hit_contigs:
        title: 'No-hit contigs'
        format: '{:,.0f}'
      no_hit_bp:
        title: 'No-hit bp'
        format: '{:,.0f}'
      mean_no_hit_length:
        title: 'Mean no-hit length'
        format: '{:,.2f}'
      median_no_hit_length:
        title: 'Median no-hit length'
        format: '{:,.0f}'
      no_hit_n50:
        title: 'No-hit N50'
        format: '{:,.0f}'
      max_no_hit_length:
        title: 'Max no-hit length'
        format: '{:,.0f}'
      min_no_hit_length:
        title: 'Min no-hit length'
        format: '{:,.0f}'

sp:
  disco_assembly_stats:
    fn: '*_assembly_stats.tsv'
  disco_diamond_stats:
    fn: '*_diamond_stats.tsv'
  disco_diamond_reads_stats:
    fn: '*_reads_diamond_stats.tsv'
  disco_kraken2_stats:
    fn: '*_kraken2_stats.tsv'
  disco_kraken2_reads_stats:
    fn: '*_reads_kraken2_stats.tsv'
  disco_darkmatter_stats:
    fn: '*_darkmatter_stats.tsv'
