# cluster params, number of jobs to be ran simullteniously
jobs: 15

#snakemake params
executor: slurm
restart-times: 0
latency-wait: 600
keep-going: true
rerun-incomplete: true
use-conda: true
show-failed-logs: true
runtime: 1-00:00:00
#######################################
# --- Default Generic Resources --- #
######################################
